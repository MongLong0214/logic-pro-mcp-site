<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Logic Pro MCP Site</title>
  <desc id="desc">The documentation and installation site for Logic Pro MCP, showing an agent signal moving through inspect, target, act, and verify stages.</desc>

  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#203033" stroke-width="1"/>
    </pattern>
    <linearGradient id="signal" x1="0" x2="1">
      <stop offset="0" stop-color="#5edfe3" stop-opacity=".15"/>
      <stop offset=".5" stop-color="#5edfe3"/>
      <stop offset="1" stop-color="#78d6a4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="24" fill="#080b0c"/>
  <rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="#273235"/>
  <rect x="1" y="1" width="1198" height="418" rx="23" fill="url(#grid)" opacity=".42"/>

  <g transform="translate(58 52)">
    <text fill="#8b9491" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="2">OFFICIAL WEBSITE · INSTALLATION · OPERATIONS</text>
    <text y="74" fill="#f5f2ea" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="64" font-weight="650" letter-spacing="-2">Logic Pro MCP</text>
    <text y="124" fill="#5edfe3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26">SITE</text>
    <text y="188" fill="#bcc5c2" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24">Install, understand, and operate the MCP server</text>
    <text y="222" fill="#bcc5c2" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24">that gives AI agents a verified path into Logic Pro.</text>

    <g transform="translate(0 270)">
      <rect width="418" height="52" rx="8" fill="#161c1e" stroke="#354144"/>
      <text x="18" y="33" fill="#78d6a4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">$ brew install logic-pro-mcp</text>
    </g>
  </g>

  <g transform="translate(640 58)">
    <text x="0" y="18" fill="#8b9491" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="2">VERIFIED SIGNAL PATH</text>
    <path d="M35 180H465" fill="none" stroke="#26383a" stroke-width="12" stroke-linecap="round"/>
    <path d="M35 180H465" fill="none" stroke="url(#signal)" stroke-width="3" stroke-linecap="round"/>

    <g transform="translate(0 105)">
      <rect width="112" height="150" rx="12" fill="#111719" stroke="#354144"/>
      <circle cx="56" cy="75" r="30" fill="#0a1011" stroke="#5edfe3" stroke-width="2"/>
      <path d="M41 75h30M41 65h30M41 85h22" stroke="#5edfe3" stroke-width="3" stroke-linecap="round"/>
      <text x="56" y="130" text-anchor="middle" fill="#f5f2ea" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">INSPECT</text>
    </g>
    <g transform="translate(138 105)">
      <rect width="112" height="150" rx="12" fill="#111719" stroke="#354144"/>
      <circle cx="56" cy="75" r="30" fill="#0a1011" stroke="#5edfe3" stroke-width="2"/>
      <path d="M39 63h34M39 87h34M48 55v16M65 79v16" stroke="#5edfe3" stroke-width="3" stroke-linecap="round"/>
      <text x="56" y="130" text-anchor="middle" fill="#f5f2ea" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">TARGET</text>
    </g>
    <g transform="translate(276 105)">
      <rect width="112" height="150" rx="12" fill="#111719" stroke="#354144"/>
      <circle cx="56" cy="75" r="30" fill="#0a1011" stroke="#f4b942" stroke-width="2"/>
      <path d="M42 62v26M56 55v33M70 67v21M36 70h12M50 64h12M64 76h12" stroke="#f4b942" stroke-width="3" stroke-linecap="round"/>
      <text x="56" y="130" text-anchor="middle" fill="#f5f2ea" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">ACT</text>
    </g>
    <g transform="translate(414 105)">
      <rect width="112" height="150" rx="12" fill="#111719" stroke="#354144"/>
      <circle cx="56" cy="75" r="30" fill="#0a1011" stroke="#78d6a4" stroke-width="2"/>
      <path d="m42 75 10 10 20-23" fill="none" stroke="#78d6a4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="56" y="130" text-anchor="middle" fill="#f5f2ea" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">VERIFY</text>
    </g>

    <g transform="translate(0 290)">
      <text fill="#8b9491" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">CLAUDE CODE</text>
      <text x="144" fill="#8b9491" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">CLAUDE DESKTOP</text>
      <text x="333" fill="#8b9491" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">CURSOR</text>
      <text x="430" fill="#8b9491" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">VS CODE</text>
    </g>
  </g>
</svg>
